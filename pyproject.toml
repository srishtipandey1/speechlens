[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "speechlens"
version = "0.1.0"
description = "Contrastive, explainable speech evaluation with temporal flaw grounding."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "python-multipart==0.0.20",
    "numpy==2.2.4",
    "scipy==1.15.2",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "praat-parselmouth==0.4.5",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "pydantic==2.10.6",
    "PyYAML==6.0.2",
    "pytest==8.3.5",
    "plotly==6.0.1",
    "pandas==2.2.3",
    "matplotlib==3.10.1",
    "scikit-learn==1.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]